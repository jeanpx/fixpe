<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Libro de Reclamaciones - Fixpe</title>
  <link rel="icon" type="image/png" href="/imagen/icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260319-3" />
</head>

<body class="page-enter">
  <main class="section claims-page">
    <div class="section-title">
      <h2>Libro de Reclamaciones</h2>
      <p>
        Completa el formulario para registrar tu reclamo o queja. Te
        responderemos al correo indicado.
      </p>
    </div>
    <form class="claims-form" action="https://formspree.io/f/xreyojqo" method="POST" id="claimsForm">
      <label>
        Nombre completo
        <input type="text" name="nombre" required />
      </label>
      <label>
        DNI / RUC
        <input type="text" name="documento" required />
      </label>
      <label>
        Correo
        <input type="email" name="correo" required />
      </label>
      <label>
        Teléfono
        <input type="tel" name="telefono" />
      </label>
      <label>
        Tipo
        <select name="tipo" required>
          <option value="">Selecciona</option>
          <option value="reclamo">Reclamo</option>
          <option value="queja">Queja</option>
        </select>
      </label>
      <label class="claims-field claims-field-wide">
        Detalle
        <textarea name="detalle" rows="5" required></textarea>
      </label>
      <label class="claims-field claims-field-wide">
        Pedido
        <textarea name="pedido" rows="3" required></textarea>
      </label>
      <button class="btn btn-ghost" type="submit">Enviar</button>
    </form>
    <p class="claims-success" id="claimsSuccess">
      Gracias, tu reclamo fue enviado. Te responderemos pronto.
    </p>
    <p class="claims-note">
      Tu reclamo o queja llegará directo a
      <a href="https://mail.google.com/mail/?view=cm&fs=1&to=info@fixpesupport.com&su=Libro%20de%20Reclamaciones%20-%20Fixpe&body=Hola%20Fixpe%2C%0A%0AAdjunto%20mi%20reclamo%20o%20queja.%0A"
        target="_blank" rel="noreferrer">
        info@fixpesupport.com
      </a>.
    </p>
    <a class="btn btn-ghost" href="/">Volver a la web</a>
  </main>
  <script>
    (function () {
      var form = document.getElementById("claimsForm");
      var success = document.getElementById("claimsSuccess");
      window.requestAnimationFrame(function () {
        window.requestAnimationFrame(function () {
          document.body.classList.add("is-ready");
        });
      });

      if (!form || !success) return;

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var formData = new FormData(form);

        fetch(form.action, {
          method: "POST",
          body: formData,
          headers: {
            Accept: "application/json",
          },
        })
          .then(function (response) {
            if (response.ok) {
              form.reset();
              success.style.display = "block";
              form.style.display = "none";
            } else {
              alert("No se pudo enviar. Intenta nuevamente.");
            }
          })
          .catch(function () {
            alert("No se pudo enviar. Intenta nuevamente.");
          });
      });
    })();
  </script>
</body>

</html>
